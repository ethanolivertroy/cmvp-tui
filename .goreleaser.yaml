version: 2
project_name: cmvp

builds:
  - main: .
    binary: cmvp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: ethanolivertroy
    name: cmvp-tui

brews:
  - repository:
      owner: ethanolivertroy
      name: homebrew-sectools
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ethanolivertroy/cmvp-tui"
    description: "Terminal UI for searching NIST CMVP validated cryptographic modules"
    license: "MIT"
    install: |
      bin.install "cmvp"
    test: |
      assert_match version.to_s, shell_output("#{bin}/cmvp --version")

scoops:
  - repository:
      owner: ethanolivertroy
      name: scoop-sectools
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/ethanolivertroy/cmvp-tui"
    description: "Terminal UI for searching NIST CMVP validated cryptographic modules"
    license: "MIT"

msi:
  - id: windows-installer
    wxs: ./windows/app.wxs
    ids:
      - default

winget:
  - name: cmvp
    publisher: ethanolivertroy
    short_description: "Terminal UI for searching NIST CMVP validated cryptographic modules"
    license: MIT
    publisher_url: https://github.com/ethanolivertroy
    homepage: https://github.com/ethanolivertroy/cmvp-tui
    tags:
      - security
      - cryptography
      - nist
      - cmvp
      - fips
      - tui
      - terminal
    repository:
      owner: ethanolivertroy
      name: winget-pkgs
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
